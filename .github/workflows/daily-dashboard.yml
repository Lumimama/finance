name: Daily dashboard refresh

# Rebuilds the dashboards and publishes them to GitHub Pages.
#
# Runs on a weekday-morning schedule, on every push to main, and on demand.
# The scheduled run is the one that matters: it means the page at
# lumimama.github.io/finance is regenerated from source rather than being a
# snapshot someone remembered to update.
#
# NOTE ON THE COMMITTED DATA: three projects here are still seeded demos, so a
# scheduled run against unchanged inputs produces byte-identical output and
# commits nothing. That is correct behaviour, not a broken workflow -- it is
# also a useful canary, because a run that suddenly *does* produce a diff means
# the pipeline changed. The Board One-Pager is the exception: it reads a Google
# Sheet, so its output changes whenever the monthly row does.

on:
  schedule:
    # 12:00 UTC on weekdays = 08:00 ET / 07:00 CT. Cron here is always UTC.
    - cron: "0 12 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      input_mode:
        description: "Board One-Pager source"
        required: false
        default: google
        type: choice
        options: [google, demo]   # demo = offline seeded run, no Google needed

permissions:
  contents: write           # required to commit regenerated dashboards
  issues: write             # required by the failure step to open an issue

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r variance-narrator/requirements.txt

      # ------------------------------------------------------------------
      # These three projects are still seeded demonstrations: their generators
      # are deterministic, so an unchanged pipeline commits nothing. The Board
      # One-Pager is the one with a live source -- see the steps below it.
      # To make another project live, point it at a real export the same way.
      # ------------------------------------------------------------------
      - name: Regenerate seeded sample data (demo projects only)
        run: |
          echo "cash-forecast-13w, board-metrics, variance-narrator: seeded demos."
          cd cash-forecast-13w && python make_sample_data.py && cd ..
          cd board-metrics     && python make_sample_data.py && cd ..
          cd variance-narrator && python make_sample_data.py && cd ..

      # ------------------------------------------------------------------
      # Board One-Pager: the one project with a LIVE source. The Sheet and Doc
      # are shared read-only by link, so this is two HTTPS GETs -- no service
      # account, no secret, nothing to leak. A failing validation exits non-zero
      # and never writes the HTML, so the last good dashboard stays published
      # rather than being replaced by a wrong one.
      # ------------------------------------------------------------------
      # An unreachable source and wrong data are different failures and are
      # treated differently. If Google cannot be read there is simply no new
      # input: warn, skip the rebuild, and leave the published page alone. If
      # the data IS readable but does not foot, that is a hard failure below.
      # Collapsing the two would either paint the repo red for a sharing
      # setting, or -- worse -- let a stale fetch look like a clean refresh.
      - name: Fetch Board One-Pager sources from Google
        id: fetch
        if: inputs.input_mode != 'demo'
        working-directory: board-one-pager
        continue-on-error: true
        run: python fetch_sources.py

      - name: Note an unreachable source
        if: inputs.input_mode != 'demo' && steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Could not read the Google sources -- no new input this run."
          echo "The published dashboard is unchanged. Check Share > General access."

      - name: Rebuild Board One-Pager
        if: inputs.input_mode == 'demo' || steps.fetch.outcome == 'success'
        working-directory: board-one-pager
        run: |
          if [ "${{ inputs.input_mode }}" = "demo" ]; then
            echo "::notice::Running the Board One-Pager from seeded demo data."
            python board.py --demo --validate \
              --html examples/board_dashboard.html \
              --manifest examples/board_manifest.json
          else
            python board.py \
              --input data/monthly_metrics.csv \
              --context data/board_context.txt \
              --validate \
              --html examples/board_dashboard.html \
              --manifest examples/board_manifest.json
          fi

      # The monthly input is the point of failure worth catching daily: if the
      # closed month never got entered, the dashboard is quietly out of date
      # while still validating perfectly. Warn rather than fail -- a stale but
      # correct dashboard is not an emergency, it is a reminder.
      - name: Check the Sheet is current
        if: inputs.input_mode != 'demo' && steps.fetch.outcome == 'success'
        working-directory: board-one-pager
        run: |
          LATEST=$(python -c "import json;print(json.load(open('examples/board_manifest.json'))['reporting_period'])")
          EXPECTED=$(date -u -d "last month" +%Y-%m)
          if [ "$LATEST" != "$EXPECTED" ]; then
            echo "::warning::Sheet's latest month is $LATEST; $EXPECTED is closed and not entered yet."
          else
            echo "Sheet is current through $LATEST."
          fi

      - name: Rebuild dashboards
        run: |
          cd cash-forecast-13w
          python cash_forecast.py --min-cash-floor 6000000 \
            --html examples/forecast.html --csv examples/forecast.csv
          python cash_forecast.py --min-cash-floor 6000000 > examples/base-case.txt
          python cash_forecast.py --collections-slip 14 --revenue-haircut 0.10 \
            --min-cash-floor 6000000 > examples/stress-case.txt
          cd ../board-metrics
          python board_metrics.py --html examples/dashboard.html
          python board_metrics.py > examples/metrics-output.txt
          cd ../variance-narrator
          python variance_narrator.py --dry-run > examples/dry-run-2026-03.txt

      # A dashboard that silently renders wrong numbers is worse than one that
      # fails loudly, so the build breaks if the ARR walk stops footing.
      - name: Verify invariants
        run: |
          cd board-metrics
          python board_metrics.py | grep -q "ties" \
            || { echo "::error::ARR walk does not foot -- refusing to publish"; exit 1; }
          echo "ARR walk ties."

      # A failed run already emails the repo owner, but an issue carries the
      # specific field and month from the validation output, which is the part
      # that says what to fix in the Sheet.
      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/issue.md <<'EOF'
          The scheduled refresh failed and nothing was republished. The last
          valid dashboard is still live.

          Usual causes, in order of likelihood:

          1. A typed value overwrote a formula in Monthly_Metrics, so an
             identity stopped footing.
          2. A required column was renamed or deleted.
          3. A month was entered twice, or skipped.
          4. Sheet link-sharing was turned off.

          The workflow log names the field and the month.
          EOF
          echo "" >> /tmp/issue.md
          echo "Run: $RUN_URL" >> /tmp/issue.md
          gh issue create \
            --title "Dashboard refresh failed: $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md || true

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes -- inputs produced identical output."
            exit 0
          fi
          git add -A
          git commit -m "Daily dashboard refresh: $(date -u +%Y-%m-%d)"
          git push
